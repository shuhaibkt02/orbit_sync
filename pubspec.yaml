name: orbit_sync
description: Universal zero-codegen offline-first synchronization engine for Flutter, SQLite, and REST APIs.
version: 1.0.0
homepage: https://github.com/shuhaibkt/orbit_sync
repository: https://github.com/shuhaibkt/orbit_sync
issue_tracker: https://github.com/shuhaibkt/orbit_sync/issues
topics:
  - offline-first
  - sqlite
  - sync
  - rest

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  sqlite_async: ^0.9.0
  sqlite3: ^2.4.0
  http: ^1.6.0
  dio: ^5.11.1
  crypto: ^3.0.3
  collection: ^1.18.0

dev_dependencies:
  test: ^1.24.0
  sync_server:
    path: test/sync_server
